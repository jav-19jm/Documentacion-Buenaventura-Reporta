<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Buenaventura Reporta API</title>
    <meta name="description" content="Documentación de la API REST de Buenaventura Reporta (OpenAPI + Scalar)." />
  </head>
  <body>
    <div id="app"></div>

    <script src="https://cdn.jsdelivr.net/npm/@scalar/api-reference"></script>
    <script>
      Scalar.createApiReference('#app', {
        // Ruta relativa para que funcione en GitHub Pages (https://<usuario>.github.io/<repo>/)
        url: './openapi.json',
        theme: 'purple',
        layout: 'modern',
        defaultHttpClient: { targetKey: 'js', clientKey: 'fetch' },
        hideClientButton: false,
        persistAuth: true,
        metaData: { title: 'Buenaventura Reporta API' },
      })
    </script>
  </body>
</html>
